[project]
name = "alarme-precos"
version = "0.1.0"
description = "Monitor de preços de passagens aéreas com SerpApi (Google Flights) e painel de cota"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.scripts]
alarme-precos = "alarme_precos:main"
alarme_precos = "alarme_precos:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
